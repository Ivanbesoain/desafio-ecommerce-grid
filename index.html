<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi E-commerce</title>

    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <div class="layout">

        <!-- NAVBAR -->
        <header class="navbar">
            <h1>Mi E-commerce</h1>
        </header>

        <!-- SIDEBAR -->
        <aside class="sidebar">
            <h2>Categorías</h2>

            <nav class="categories">
                <a href="#" class="category">Perfumes <span>(13)</span></a>
                <a href="#" class="category">Ropa <span>(21)</span></a>
                <a href="#" class="category">Accesorios <span>(41)</span></a>
                <a href="#" class="category">Zapatos <span>(10)</span></a>
            </nav>
        </aside>

        <!-- MAIN -->
        <main class="main-content">

            <section class="products-grid">

                <!-- CARD 1 -->
                <article class="product-card">
                    <div class="product-img">
                        <img src="assets/img/producto1.jpg" alt="Producto 1">
                    </div>

                    <div class="product-info">
                        <h3>Perfume myKingdom</h3>
                        <p class="price">$31.400</p>
                    </div>

                    <button class="btn-buy">Comprar</button>
                </article>

                <!-- CARD 2 -->
                <article class="product-card">
                    <div class="product-img">
                        <img src="assets/img/producto2.jpg" alt="Producto 2">
                    </div>

                    <div class="product-info">
                        <h3>Perfume Phantom</h3>
                        <p class="price">$48.890</p>
                    </div>

                    <button class="btn-buy">Comprar</button>
                </article>

                <!-- CARD 3 -->
                <article class="product-card">
                    <div class="product-img">
                        <img src="assets/img/producto3.jpg" alt="Producto 3">
                    </div>

                    <div class="product-info">
                        <h3>Zapatos Docker</h3>
                        <p class="price">$23.300</p>
                    </div>

                    <button class="btn-buy">Comprar</button>
                </article>

                <!-- CARD 4 -->
                <article class="product-card">
                    <div class="product-img">
                        <img src="assets/img/producto4.jpg" alt="Producto 4">
                    </div>

                    <div class="product-info">
                        <h3>Polerón Puma</h3>
                        <p class="price">$44.700</p>
                    </div>

                    <button class="btn-buy">Comprar</button>
                </article>

            </section>
        </main>

        <!-- FOOTER -->
        <footer class="footer">
            <p>© 2026 Mi E-commerce</p>
        </footer>

    </div>

</body>

</html>
